name: Get Citation Data

"on":
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Reqs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Update citation cache
        run: |
          python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Commit citation cache
        run: |
          if git diff --quiet -- assets/data/gs_data.json assets/data/gs_data_shieldsio.json; then
            echo "No citation data changes"
            exit 0
          fi
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add assets/data/gs_data.json assets/data/gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push
